<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Sites — a round-based tactical shooter</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js"
  }
}
</script>
</head>
<body>
<div id="game"></div>
<div id="hud" aria-hidden="true"></div>

<div id="overlay" class="overlay">
  <section class="panel" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
    <h1 id="overlay-title">Two Sites</h1>
    <p id="overlay-copy">Round-based tactical shooter. Attackers carry a bomb to A or B. Defenders hold. Click to play.</p>
    <button id="play" type="button">Click to play</button>
    <ul class="keys">
      <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move</li>
      <li><kbd>Mouse</kbd> Aim</li>
      <li><kbd>Click</kbd> Fire</li>
      <li><kbd>R</kbd> Reload</li>
      <li><kbd>Ctrl</kbd> Crouch</li>
      <li><kbd>Shift</kbd> Walk</li>
      <li><kbd>Space</kbd> Jump</li>
      <li><kbd>B</kbd> Buy (freeze only)</li>
      <li><kbd>E</kbd> Plant / defuse</li>
    </ul>
  </section>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
